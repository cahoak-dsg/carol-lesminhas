<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2e8" />
  <title>Carol, nossa luz 💚</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f2e8}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f2e8}
  </style>
</head>
<body>
  <iframe id="site" src="index%20(2).html" title="Carol, nossa luz"></iframe>
  <script>
    const frame=document.getElementById('site');
    frame.addEventListener('load',()=>{
      const d=frame.contentDocument;
      if(!d) return;

      const candles=d.querySelector('section.candles');
      if(candles){
        const title=candles.querySelector('h2');
        if(title) title.textContent='Quando tantas luzes se acenderam por vocês.';
        const symbolism=candles.querySelector('.symbolism');
        if(symbolism){
          symbolism.innerHTML=`
            <p>No chá de bebê do Yuri, você colocou um pedacinho desse momento nas mãos de cada pessoa que estava ali. Em cada vela, um pedido simples e lindo: <strong>“No dia do meu nascimento, acenda essa vela para iluminar minha chegada.”</strong></p>
            <p style="margin-top:16px">E quando o dia 23/08 finalmente chegou, aquelas chamas deixaram de ser só lembranças do chá. Viraram presença, intenção, carinho e desejo de proteção.</p>
            <p style="margin-top:16px">Não foram apenas seis velas acesas. Foram várias, em casas diferentes, por pessoas diferentes, cada uma fazendo do seu jeito um pedido silencioso pela chegada do Yuri. Nós também fizemos os nossos. Cada uma na sua casa, no seu momento, pensando em vocês.</p>
            <p style="margin-top:16px">Talvez por isso essa parte tenha tanto significado. Porque a vela nunca foi só uma vela. Ela sempre foi um símbolo muito seu. E naquele dia, de um jeito muito bonito, <span class="highlight">a luz que você distribuiu para tanta gente voltou para iluminar vocês três.</span></p>`;
        }
      }

      const eyebrow=[...d.querySelectorAll('.eyebrow')].find(el=>el.textContent.trim().toLowerCase()==='um lembrete importante');
      const reminderSection=eyebrow?.closest('section.story');
      if(reminderSection){
        const card=reminderSection.querySelector('.card.message');
        if(card){
          card.innerHTML=`
            <div class="eyebrow">um lembrete importante</div>
            <h2>Você não precisa viver tudo isso de um jeito bonito o tempo todo.</h2>
            <p>Esse começo pode ser lindo, emocionante e cheio de amor, e ainda assim ser cansativo, confuso, intenso e difícil em alguns dias.</p>
            <p>Você pode amar o Yuri mais do que imaginava e, ao mesmo tempo, sentir sono, irritação, insegurança, vontade de chorar ou de ficar cinco minutos sozinha. <strong>Uma coisa não diminui a outra.</strong></p>
            <p>Você não precisa aproveitar cada segundo, estar grata o tempo inteiro ou dar conta de tudo como se fosse fácil.</p>
            <p><span class="highlight">Pode viver essa fase do jeito que ela vier.</span></p>
            <p>Nos dias leves, aproveita.<br>Nos dias caóticos, atravessa.<br>Nos dias difíceis, deixa a gente estar aí também.</p>
            <p>E em todos eles, você continua sendo a Carol que a gente ama absurdamente.</p>`;
        }
        const caption=reminderSection.querySelector('.reminder-caption');
        if(caption) caption.textContent='todos os jeitos dessa fase cabem aqui 💚';
      }
    });
  </script>
</body>
</html>
